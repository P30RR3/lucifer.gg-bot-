# ─────────────────────────────────────────────────────────────
#  Krypton — golangci-lint config
# ─────────────────────────────────────────────────────────────
version: "2"

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true
  modules-download-mode: readonly
  go: "1.22"

output:
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true

linters:
  default: none
  enable:
    # ── Correctitud ─────────────────────────────────────────
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - bodyclose
    - contextcheck
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - copyloopvar
    - nilerr
    - nilnil
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - wastedassign
    # ── Estilo ──────────────────────────────────────────────
    - revive
    - gocritic
    - misspell
    - godot
    - dupl
    - gocyclo
    - gocognit
    - funlen
    - lll
    - nestif
    - prealloc
    # ── Seguridad ───────────────────────────────────────────
    - gosec
    # ── Performance ─────────────────────────────────────────
    - perfsprint
    # ── Imports ─────────────────────────────────────────────
    - gci
  disable:
    - godox      # permitimos TODOs temporales durante desarrollo
    - wsl        # demasiado ruidoso

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  govet:
    enable-all: true
    disable:
      - fieldalignment
  gocyclo:
    min-complexity: 20
  gocognit:
    min-complexity: 30
  funlen:
    lines: 120
    statements: 80
  lll:
    line-length: 140
    tab-width: 4
  dupl:
    threshold: 150
  gosec:
    excludes:
      - G404 # math/rand en contextos no criptográficos está permitido
  revive:
    rules:
      - name: exported
        arguments: ["checkPrivateReceivers", "disableStutteringCheck"]
      - name: package-comments
      - name: var-naming
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
  gci:
    sections:
      - standard
      - default
      - prefix(github.com/krypton-discord/krypton)

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - dupl
        - funlen
        - gocognit
        - gocyclo
    - path: cmd/
      linters:
        - funlen
  max-issues-per-linter: 0
  max-same-issues: 0